version: "3.8"

services:
  ringtrace-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ringtrace_ai_production
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp/matplotlib_cache
      - OMP_NUM_THREADS=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
