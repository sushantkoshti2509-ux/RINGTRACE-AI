services:
  - type: web
    name: ringtrace-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib_cache
      - key: OMP_NUM_THREADS
        value: 1
